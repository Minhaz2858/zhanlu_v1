# ── Zhanlu production override (drop-in, not committed to git) ─────────
# Generated by deploy/install.sh. Adds:
#   * restart: unless-stopped on long-running services
#   * a zhanlu-frontend (nginx:alpine) container serving the bundled
#     frontend/dist and proxying /api to backend (no nginx apt-install on host)
# Backed by docker-compose merge — base compose file is unchanged.
services:
  backend:
    restart: unless-stopped
  sandbox-worker:
    restart: unless-stopped
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  minio:
    restart: unless-stopped

  # ── Frontend (nginx in a container) ────────────────────────────────────
  # Connects to backend over the existing app_net network.
  # WEB_PORT (default 80) can be overridden in .env.
  frontend:
    image: nginx:alpine
    container_name: zhanlu-frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/frontend.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
