name: CI

# ADLC P0-1 (2026-10-08): the old workflow pointed at a nonexistent
# `zhanlu/backend` dir and ran zero tests. Now: correct paths, a real
# pytest job (fast deterministic suites — the full suite OOMs single-run),
# and a nightly prompt golden-set regression.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * *" # nightly 03:00 UTC — golden prompt regression

jobs:
  backend-lint:
    name: Backend (lint + import smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest pytest-asyncio
      - name: Ruff check
        run: ruff check app/ || true
      - name: Import smoke test (app boots without a live DB)
        env:
          JWT_SECRET: ci-secret
          DATABASE_URL: "sqlite:///./ci-smoke.db"
        run: |
          python -c "import app.models; from app.database import Base, engine; Base.metadata.create_all(engine); print('models OK')"
          python -c "from app.routers.entities import register_entity_router; print('entity router OK')"

  backend-tests:
    name: Backend (pytest — fast suites)
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-secret
      DATABASE_URL: "sqlite:///file::memory:?cache=shared&uri=true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio httpx
      # Fast deterministic suites: protocols, prompts, eval, lifecycle,
      # delegation. Heavy suites (full FSM/app-boot tests) are excluded —
      # they require the container runtime and exceed CI memory.
      - name: Run fast test tiers
        run: |
          python -m pytest tests/test_a2a_external_agents.py \
            tests/test_a2a_protocol.py tests/test_acp_adapter.py \
            tests/test_prompt_p0_fixes.py tests/test_prompt_p1_p2_fixes.py \
            tests/test_invocation_enrichment.py tests/test_routing_feedback.py \
            tests/test_swarm_data_pipeline.py tests/test_tool_selection_metrics.py \
            tests/test_metadata_only_detector.py tests/test_task_spec_sanitization.py \
            tests/test_agent_definitions_prompts.py tests/test_dynamic_prompt_builder.py \
            tests/test_prompt_caching.py tests/test_eval_pipeline.py \
            tests/test_eval_ci.py tests/test_agent_lifecycle.py \
            -p no:jaxtyping -p no:cacheprovider -q

  nightly-golden-prompts:
    name: Nightly prompt golden set (A/B harness smoke)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Golden set smoke run (requires LLM_* secrets to be meaningful)
        env:
          JWT_SECRET: ci-secret
          DATABASE_URL: "sqlite:///./golden.db"
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          python scripts/run_prompt_golden_set.py --limit 3 || \
            echo "::warning::Golden set run failed (LLM endpoint unreachable?)"

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Typecheck
        run: npm run typecheck || true
      - name: Build
        env:
          VITE_BASE44_APP_ID: ci-app
        run: npm run build
