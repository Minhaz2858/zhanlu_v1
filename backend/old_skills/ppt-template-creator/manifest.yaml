name: ppt-template-creator
version: 1.0.0
description: Creates self-contained PPT template SKILLS (not presentations) from user-provided
  PowerPoint templates. Use ONLY when a user wants to create a reusable skill from
  their template. For creating actual presentations, use the pptx skill instead.
category: ppt-template-creator
source: bundled
requires_sandbox: false
artifact_types:
- pptx
- md
