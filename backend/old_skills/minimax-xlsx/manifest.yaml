name: minimax-xlsx
version: 1.0.0
description: 'Open, create, read, analyze, edit, or validate Excel/spreadsheet files
  (.xlsx, .xlsm, .csv, .tsv). Use when the user asks to create, build, modify, analyze,
  read, validate, or format any Excel spreadsheet, financial model, pivot table, or
  tabular data file. Covers: creating new xlsx from scratch, reading and analyzing
  existing files, editing existing xlsx with zero format loss, formula recalculation
  and validation, and applying professional financial formatting standards. Triggers
  on ''spreadsheet'', ''Excel'', ''.xlsx'', ''.csv'', ''pivot table'', ''financial
  model'', ''formula'', or any request to produce tabular data in Excel format.'
license: MIT
category: minimax-xlsx
source: bundled
requires_sandbox: false
artifact_types:
- xlsx
- md
