<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Zhanlu theme-font aliases (2026-08-29).

  The 12 ThemePresets declare Google Fonts family names (Archivo Black,
  Space Grotesk, Manrope, ...) that are NOT installed in this container.
  Without these aliases Chromium/LibreOffice fall back to the container
  default sans -> every slide loses its intended typeface.

  Each alias maps a declared theme font to an installed family from
  /usr/share/fonts/truetype/zhanlu (free Google Fonts shipped with the
  canvas-design skill).  binding="same" makes fontconfig substitute the
  target for the source in ALL contexts (matching + rendering), so the
  HTML image-fill pipeline renders the intended look.
-->
<fontconfig>
  <!-- bold_signal: Archivo Black -> Big Shoulders (bold condensed display) -->
  <alias binding="same"><family>Archivo Black</family><prefer><family>Big Shoulders</family></prefer></alias>
  <!-- bold_signal / creative_voltage body: Space Grotesk -> Bricolage Grotesque -->
  <alias binding="same"><family>Space Grotesk</family><prefer><family>Bricolage Grotesque</family></prefer></alias>
  <!-- electric_studio / split_pastel: Manrope / Plus Jakarta Sans -> Outfit -->
  <alias binding="same"><family>Manrope</family><prefer><family>Outfit</family></prefer></alias>
  <alias binding="same"><family>Plus Jakarta Sans</family><prefer><family>Outfit</family></prefer></alias>
  <!-- creative_voltage display: Syne -> Tektur (futuristic geometric) -->
  <alias binding="same"><family>Syne</family><prefer><family>Tektur</family></prefer></alias>
  <!-- dark_botanical / vintage_editorial display: Fraunces -> Lora (serif) -->
  <alias binding="same"><family>Fraunces</family><prefer><family>Lora</family></prefer></alias>
  <!-- dark_botanical body: Inter -> Instrument Sans -->
  <alias binding="same"><family>Inter</family><prefer><family>Instrument Sans</family></prefer></alias>
  <!-- notebook_tabs display: Caveat -> Nothing You Could Do (handwritten) -->
  <alias binding="same"><family>Caveat</family><prefer><family>Nothing You Could Do</family></prefer></alias>
  <!-- pastel_geometry: DM Serif Display -> Young Serif; DM Sans -> Instrument Sans -->
  <alias binding="same"><family>DM Serif Display</family><prefer><family>Young Serif</family></prefer></alias>
  <alias binding="same"><family>DM Sans</family><prefer><family>Instrument Sans</family></prefer></alias>
  <!-- neon_cyber: Orbitron -> Tektur; Rajdhani -> Jura (techy) -->
  <alias binding="same"><family>Orbitron</family><prefer><family>Tektur</family></prefer></alias>
  <alias binding="same"><family>Rajdhani</family><prefer><family>Jura</family></prefer></alias>
  <!-- terminal_green: JetBrains Mono is INSTALLED (no alias needed) -->
  <!-- swiss_modern: Helvetica Neue -> Instrument Sans (clean grotesque) -->
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Instrument Sans</family></prefer></alias>
  <!-- paper_and_ink: Crimson Pro INSTALLED; Source Sans 3 -> Instrument Sans -->
  <alias binding="same"><family>Source Sans 3</family><prefer><family>Instrument Sans</family></prefer></alias>
  <!-- CJK: Microsoft YaHei not on Linux -> Noto Sans SC (installed, free) -->
  <alias binding="same"><family>Microsoft YaHei</family><prefer><family>Noto Sans SC</family><family>Arial Unicode MS</family></prefer></alias>
  <!-- CJK display serif: 宋体/Source Han Serif for editorial themes -->
  <alias binding="same"><family>SimSun</family><prefer><family>Source Han Serif CN VF</family></prefer></alias>
</fontconfig>
