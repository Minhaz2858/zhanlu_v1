# ============================================================================
# Zhanlu PostgreSQL Configuration
# Tuned for a container with 512 MB memory limit.
# Mounted at /etc/postgresql/postgresql.conf or loaded via ALTER SYSTEM.
# ============================================================================

# ── Connection Settings ──────────────────────────────────────────────────────
listen_addresses = '*'
port = 5432
max_connections = 50              # PgBouncer pools, so keep this moderate
superuser_reserved_connections = 3

# ── Memory (tuned for 512 MB container limit) ────────────────────────────────
shared_buffers = 128MB            # ~25% of container memory
work_mem = 4MB                    # Per-operation sort/hash memory
maintenance_work_mem = 64MB       # For VACUUM, CREATE INDEX
wal_buffers = 4MB
effective_cache_size = 384MB      # ~75% of container memory (OS + PG cache estimate)

# ── Write-Ahead Log (WAL) ───────────────────────────────────────────────────
wal_level = replica               # Allows pg_basebackup for replication if needed later
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# ── Planner ──────────────────────────────────────────────────────────────────
random_page_cost = 1.1            # SSD-backed storage (default 4.0 is for HDD)
effective_io_concurrency = 200

# ── Query Tuning ─────────────────────────────────────────────────────────────
# Statistics collection for the planner
default_statistics_target = 100

# ── Autovacuum ───────────────────────────────────────────────────────────────
# Aggressive autovacuum prevents table bloat in a write-heavy artifact workflow.
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05       # Vacuum when 5% of rows are dead
autovacuum_analyze_scale_factor = 0.025     # Analyze when 2.5% of rows change
autovacuum_vacuum_cost_limit = 200           # Higher = faster vacuum (default 200)

# ── Logging ──────────────────────────────────────────────────────────────────
log_destination = 'stderr'
logging_collector = off

# Log slow queries (>1 second) for performance monitoring
log_min_duration_statement = 1000          # ms — queries running >1s
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '
log_statement = 'none'                     # Don't log every query (use pg_stat_statements for that)
log_connections = on
log_disconnections = on
log_lock_waits = on                        # Log queries waiting for locks >1s
log_temp_files = 10MB                      # Log temp files >10MB (sort spill warnings)

# ── Security ─────────────────────────────────────────────────────────────────
# Require password authentication for all connections
# (configured in pg_hba.conf, not here)

# ── Extensions Tracking ──────────────────────────────────────────────────────
shared_preload_libraries = 'pg_stat_statements'    # Query performance tracking

# ── pg_stat_statements ───────────────────────────────────────────────────────
pg_stat_statements.max = 1000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on
