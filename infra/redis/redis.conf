# Zhanlu Redis configuration
# Appended to redis-server command via docker compose volumes

# ── Persistence ──────────────────────────────────────────────────────
# Redis is used for queues + ephemeral event fanout.
# Append-only file keeps data across restarts.
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ── Memory ───────────────────────────────────────────────────────────
maxmemory 256mb
maxmemory-policy noeviction

# ── Eviction ─────────────────────────────────────────────────────────
# Do NOT evict keys when memory is full (queues contain critical job data).
# If memory pressure is high, increase maxmemory or add a second Redis node.

# ── Save ─────────────────────────────────────────────────────────────
# Minimal RDB snapshots (AOF is the primary persistence mechanism).
save 900 1
save 300 10
save 60 10000

# ── Networking ───────────────────────────────────────────────────────
bind 0.0.0.0
protected-mode no
