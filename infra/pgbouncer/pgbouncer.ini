;; ============================================================================
;; Zhanlu PgBouncer Configuration
;; Transaction-pooling mode — ideal for FastAPI stateless HTTP connections.
;; Sits between backend containers and PostgreSQL:16.
;; ============================================================================

[databases]
;; Database alias = actual PostgreSQL connection string
zhanlu = host=postgres port=5432 dbname=zhanlu

[pgbouncer]
;; ── Connection Settings ───────────────────────────────────────────────────
listen_addr = 0.0.0.0
listen_port = 6432

;; Authentication: plain (password passed through to PostgreSQL).
;; PgBouncer authenticates users against userlist.txt, then
;; PostgreSQL verifies the password against pg_authid.
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

;; ── Pooling Mode ─────────────────────────────────────────────────────────
;; transaction: server connections released back to pool after each
;; transaction commit/rollback. Best for stateless HTTP API backends.
pool_mode = transaction

;; ── Pool Sizing ──────────────────────────────────────────────────────────
;; Maximum client connections (from application)
max_client_conn = 100

;; Default pool size per user+database pair
default_pool_size = 20

;; Reserve pool: extra connections for sudden spikes
reserve_pool_size = 5
reserve_pool_timeout = 3         ;; seconds — how fast to activate reserve

;; Maximum database connections (capped at PostgreSQL max_connections - superuser_reserved)
max_db_connections = 50

;; Maximum user connections
max_user_connections = 50

;; ── Timeouts ─────────────────────────────────────────────────────────────
;; Client idle timeout (disconnect idle clients)
client_idle_timeout = 600        ;; 10 minutes

;; Server connection idle timeout (close unused PG connections)
server_idle_timeout = 300         ;; 5 minutes

;; Server lifetime (recycle long-lived connections)
server_lifetime = 3600            ;; 1 hour

;; Server connect timeout (how long to wait for PG to accept)
server_connect_timeout = 15       ;; 15 seconds

;; Client login timeout
client_login_timeout = 60         ;; 60 seconds

;; Query timeout (cancel queries running too long — backend has its own timeout too)
query_timeout = 120               ;; 2 minutes

;; ── Logging ──────────────────────────────────────────────────────────────
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60                 ;; Log pool stats every 60 seconds

;; ── Admin Console ────────────────────────────────────────────────────────
;; Optional: enable admin database for SHOW POOLS, SHOW STATS, etc.
;admin_users = zhanlu
;stats_users = zhanlu

;; ── Other ────────────────────────────────────────────────────────────────
;; Ignore startup parameters that some drivers send but PgBouncer doesn't support
ignore_startup_parameters = extra_float_digits,options,statement_timeout,application_name

;; Application name forwarding
application_name_add_host = 1
