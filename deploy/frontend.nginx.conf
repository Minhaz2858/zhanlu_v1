# ── Zhanlu Frontend (nginx) ──────────────────────────────────────────────
# Loaded into the zhanlu-frontend container (nginx:alpine) via docker-compose
# override. Proxies /api -> http://backend:5002 with SSE-friendly settings.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches backend MAX_ARTIFACT_MB (default 100m).
    client_max_body_size 100m;

    # ── API proxy (SSE/streaming-chat friendly) ────────────────────────────
    location /api/ {
        proxy_pass http://backend:5002;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required for SSE / chat streaming.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Static assets (hashed Vite bundles) — cache aggressively ──────────
    # Vite emits content-hashed filenames (`index-XXXXXXXX.js`). Any change
    # produces a NEW filename, so it's safe to cache them forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── SPA fallback — never cache the HTML shell ─────────────────────────
    # Without this, the browser uses heuristic Last-Modified caching and
    # serves the stale HTML+JS bundle even after the container was rebuilt.
    # That's exactly the bug that surfaced 2026-08-09 when users kept
    # loading a pre-fix bundle that wrote "Sorry, the connection was
    # interrupted" rows even though the backend had been fixed.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
